[package]
name = "anyps5-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
ring = "0.17.14"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "clipboard", "links"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }

# Optimize all GUI dependencies even in debug mode for 60-144 FPS smoothness
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
